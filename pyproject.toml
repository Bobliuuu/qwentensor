[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qwentensor"
version = "0.1.0"
description = "Run an arbitrary PyTorch network (quantized to integers) inside Qwen3.5 via the qwenTPU machinery"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]
qwentpu = ["qwentpu"]   # pip install -e ~/qwentpu_src/qwentpu  (needed only by qwentensor.machine)

[tool.setuptools.packages.find]
include = ["qwentensor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
