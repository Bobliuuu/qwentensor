[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qwentensor"
version = "0.1.0"
description = "Compile a small quantized PyTorch network to a prompt and run it inside Qwen3.5 via the qwenTPU machinery"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1", "qwentpu @ git+https://github.com/Bobliuuu/qwentpu.git"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["qwentensor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
