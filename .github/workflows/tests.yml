name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, qwenTPU from git)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,qwentpu]"
      - name: CPU tests only
        run: |
          # exit code 5 = no tests collected yet; allowed until tests/ exists
          pytest -q -m "not gpu" || [ $? -eq 5 ]
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: results.js is in sync with results.json
        run: |
          sh docs/site/sync.sh
          git diff --exit-code docs/site/data
