<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#fff"/><rect x="40" y="30" width="200" height="50" rx="12" fill="#2563eb"/><text x="140" y="64" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="28" fill="#fff">qwentensor</text><text x="264" y="66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#141a26">PROMPT LAYOUT</text><text x="1560" y="64" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#6b7488">digits MLP, CPU-simulator build (A100 run: 434 tokens)</text><line x1="40" y1="96" x2="1560" y2="96" stroke="#dfe4ec" stroke-width="2"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b7488"/></marker></defs><rect x="60" y="170" width="1480" height="190" rx="20" fill="#fbfcfe" stroke="#dfe4ec" stroke-width="2"/><text x="90" y="210" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="24" fill="#6b7488">PROMPT&#160;&#160;496 tokens, in this order</text><rect x="80" y="230" width="890" height="110" rx="16" fill="#fff0dd" stroke="#f08a24" stroke-width="3"/><text x="525.0" y="276" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#f08a24">WEIGHTS (CELL)</text><text x="525.0" y="308" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#141a26">347 tokens</text><text x="525.0" y="332" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="17" fill="#6b7488">one token per nonzero weight</text><rect x="980" y="230" width="290" height="110" rx="16" fill="#efe6fb" stroke="#7c3aed" stroke-width="3"/><text x="1125.0" y="276" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#7c3aed">PROGRAM (PROG)</text><text x="1125.0" y="308" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#141a26">101 tokens</text><text x="1125.0" y="332" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="17" fill="#6b7488">succ, dest, mask, shift</text><rect x="1280" y="230" width="230" height="110" rx="16" fill="#dcf5e4" stroke="#16a34a" stroke-width="3"/><text x="1395.0" y="276" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#16a34a">INPUT (ACT)</text><text x="1395.0" y="308" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#141a26">48 tokens</text><text x="1395.0" y="332" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="17" fill="#6b7488">register init</text><rect x="60" y="400" width="1480" height="210" rx="20" fill="#fbfcfe" stroke="#dfe4ec" stroke-width="2"/><text x="90" y="442" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="24" fill="#6b7488">EMITTED BY QWEN&#160;&#160;51 tokens, one per step</text><rect x="90" y="490" width="172" height="64" rx="32" fill="#e6ebf3" stroke="#64748b" stroke-width="3"/><text x="176.0" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#64748b">READ op0</text><rect x="278" y="490" width="189" height="64" rx="32" fill="#dbe7ff" stroke="#2563eb" stroke-width="3"/><text x="372.5" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#2563eb">ACT r16=7</text><rect x="483" y="490" width="172" height="64" rx="32" fill="#e6ebf3" stroke="#64748b" stroke-width="3"/><text x="569.0" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#64748b">READ op1</text><rect x="671" y="490" width="206" height="64" rx="32" fill="#dbe7ff" stroke="#2563eb" stroke-width="3"/><text x="774.0" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#2563eb">ACT r17=15</text><text x="936.5" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#6b7488">...</text><rect x="996" y="490" width="189" height="64" rx="32" fill="#dbe7ff" stroke="#2563eb" stroke-width="3"/><text x="1090.5" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#2563eb">ACT r41=0</text><rect x="1201" y="490" width="104" height="64" rx="32" fill="#efe6fb" stroke="#7c3aed" stroke-width="3"/><text x="1253.0" y="531" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="24" fill="#7c3aed">HALT</text><text x="90" y="590" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="20" fill="#6b7488">next token = succ[slot(current token)] (+ the computed value bits after a READ).&#160;&#160;Token ids: qwentensor/machine/spec.py</text><text x="80" y="680" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="22" fill="#6b7488">READ opj: the model starts op j.&#160;&#160; ACT r=v: it writes value v to register r.&#160;&#160; HALT: the successor of the last op.</text><text x="80" y="730" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="22" fill="#141a26">The prompt is the only host input. After it the host does: argmax; append.</text></svg>