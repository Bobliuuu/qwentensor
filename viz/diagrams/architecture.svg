<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#fff"/><rect x="40" y="30" width="200" height="50" rx="12" fill="#2563eb"/><text x="140" y="64" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="28" fill="#fff">qwentensor</text><text x="264" y="66" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="36" fill="#141a26">ARCHITECTURE</text><text x="1560" y="64" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" fill="#6b7488">PyTorch to a stock Qwen3.5</text><line x1="40" y1="96" x2="1560" y2="96" stroke="#dfe4ec" stroke-width="2"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b7488"/></marker></defs><rect x="50" y="230" width="215" height="150" rx="18" fill="#dbe7ff" stroke="#2563eb" stroke-width="3"/><text x="157.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#2563eb">nn.Module</text><text x="157.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">PyTorch code</text><rect x="305" y="230" width="215" height="150" rx="18" fill="#dbe7ff" stroke="#2563eb" stroke-width="3"/><text x="412.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#2563eb">torch.fx</text><text x="412.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">float graph</text><line x1="267" y1="305" x2="301" y2="305" stroke="#6b7488" stroke-width="4" marker-end="url(#a)"/><rect x="560" y="230" width="215" height="150" rx="18" fill="#fff0dd" stroke="#f08a24" stroke-width="3"/><text x="667.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#f08a24">quantize</text><text x="667.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">5-bit integers</text><line x1="522" y1="305" x2="556" y2="305" stroke="#6b7488" stroke-width="4" marker-end="url(#a)"/><rect x="815" y="230" width="215" height="150" rx="18" fill="#fff0dd" stroke="#f08a24" stroke-width="3"/><text x="922.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#f08a24">integer IR</text><text x="922.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">int ops</text><line x1="777" y1="305" x2="811" y2="305" stroke="#6b7488" stroke-width="4" marker-end="url(#a)"/><rect x="1070" y="230" width="215" height="150" rx="18" fill="#efe6fb" stroke="#7c3aed" stroke-width="3"/><text x="1177.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#7c3aed">prompt</text><text x="1177.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">all of the above</text><line x1="1032" y1="305" x2="1066" y2="305" stroke="#6b7488" stroke-width="4" marker-end="url(#a)"/><rect x="1325" y="230" width="215" height="150" rx="18" fill="#dcf5e4" stroke="#16a34a" stroke-width="3"/><text x="1432.5" y="303.0" text-anchor="middle" font-family="Menlo,Monaco,monospace" font-weight="800" font-size="26" fill="#16a34a">Qwen3.5</text><text x="1432.5" y="339.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">writes every token</text><line x1="1287" y1="305" x2="1321" y2="305" stroke="#6b7488" stroke-width="4" marker-end="url(#a)"/><text x="300" y="215" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#2563eb">frontend (host, once)</text><text x="655" y="215" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="1" fill="#6b7488"></text><rect x="40" y="410" width="1090" height="10" rx="5" fill="#dbe7ff"/><text x="585" y="455" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="24" fill="#6b7488">compile time: runs on the host, once per network</text><rect x="1160" y="410" width="400" height="10" rx="5" fill="#dcf5e4"/><text x="1360" y="455" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="24" fill="#6b7488">run time: inside the model</text><rect x="60" y="520" width="1480" height="320" rx="22" fill="#f5f7fb" stroke="#dfe4ec" stroke-width="2"/><text x="90" y="566" text-anchor="start" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="24" fill="#6b7488">RUN TIME LOOP</text><rect x="120" y="620" width="260" height="130" rx="18" fill="#fff0dd" stroke="#f08a24" stroke-width="3"/><text x="250.0" y="683.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#f08a24">HOST</text><text x="250.0" y="719.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">argmax; append</text><rect x="600" y="610" width="360" height="150" rx="18" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><text x="780.0" y="683.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="26" fill="#2563eb">QWEN3.5</text><text x="780.0" y="719.0" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" fill="#6b7488">stock weights, no training</text><line x1="390" y1="670" x2="590" y2="670" stroke="#f08a24" stroke-width="4" marker-end="url(#a)"/><line x1="590" y1="715" x2="390" y2="715" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="490" y="655" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#f08a24">token</text><text x="490" y="745" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#16a34a">next token</text><text x="1250" y="640" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="800" font-size="28" fill="#141a26">The model's output is its next input.</text><text x="1250" y="684" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="24" fill="#6b7488">The host never computes: it picks the largest</text><text x="1250" y="716" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" font-size="24" fill="#6b7488">logit and appends it, until the model emits HALT.</text></svg>